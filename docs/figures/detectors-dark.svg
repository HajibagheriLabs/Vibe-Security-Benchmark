<title id="t">Static detection: VibeSec rules vs Semgrep registry packs</title>
<desc id="d">Grouped column chart of precision, recall and F1 for three Semgrep detector arms on web and mobile/desktop outputs, scored against the judge panel.</desc>
<rect x="0.5" y="0.5" width="999" height="568" rx="14" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="40.0" y="50.0" font-size="22" fill="#f0f6fc" font-weight="700">Catching what slips through: project rules vs. registry rules</text>
<text x="40.0" y="77.0" font-size="14" fill="#b1bac4">Semgrep run on every security-task output and scored against the judge panel. A finding counts</text>
<text x="40.0" y="97.0" font-size="14" fill="#b1bac4">only if its vulnerability class matches the scenario’s target class.</text>
