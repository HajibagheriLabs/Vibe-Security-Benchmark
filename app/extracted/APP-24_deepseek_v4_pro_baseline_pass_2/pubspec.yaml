# pubspec.yaml
name: image_cropper_native
description: A Flutter image cropping utility with native dependencies.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  image: ^4.1.7
  path_provider: ^2.1.2
  cross_file: ^0.3.3+8
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true