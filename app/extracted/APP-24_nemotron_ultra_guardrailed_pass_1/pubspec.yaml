name: image_crop_example
description: Example app demonstrating secure image cropping with native dependencies.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_cropper: ^8.0.1
  image_picker: ^1.1.1
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true