name: secure_crop_app
description: A Flutter application demonstrating native image cropping with secure storage.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Native image cropping: Uses native iOS/Android APIs for performance and security.
  # Verified: https://pub.dev/packages/image_cropper
  # Source: https://github.com/hui-z/image_cropper
  image_cropper: ^5.0.1

  # Secure storage for the cropped image path/metadata (if needed) or session token.
  # Verified: https://pub.dev/packages/flutter_secure_storage
  # Source: https://github.com/agilgur5/flutter_secure_storage
  flutter_secure_storage: ^9.0.0

  # State management for UI flow
  # Verified: https://pub.dev/packages/provider
  # Source: https://github.com/rrousselGit/provider
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true