name: image_cropper_utility
description: A Flutter plugin for cropping images using native platform implementations.
version: 1.0.0
homepage: https://github.com/example/image_cropper_utility

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.image_cropper_utility
        pluginClass: ImageCropperUtilityPlugin
      ios:
        pluginClass: ImageCropperUtilityPlugin
      macos:
        pluginClass: ImageCropperUtilityPlugin
      windows:
        pluginClass: ImageCropperUtilityPlugin
      linux:
        pluginClass: ImageCropperUtilityPlugin